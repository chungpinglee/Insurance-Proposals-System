        const STORAGE_KEY = "gh_secure_global_session_key";

        window.onload = async () => {
            // 優先從 Hash (#pw=...) 讀取傳遞密碼，否則讀取 SessionStorage
            let passToTry = "";
            if (window.location.hash.includes("pw=")) {
                const match = window.location.hash.match(/pw=([^&]+)/);
                if (match) passToTry = decodeURIComponent(match[1]);
            }
            if (!passToTry) {
                passToTry = sessionStorage.getItem(STORAGE_KEY) || "";
            }

            if (passToTry) {
                const success = await decryptAndRender(passToTry);
                if (success) {
                    sessionStorage.setItem(STORAGE_KEY, passToTry);
                    // 清理網址列 Hash 痕跡，避免密碼洩漏
                    if (window.location.hash) {
                        history.replaceState(null, "", window.location.pathname + window.location.search);
                    }
                    return;
                }
            }
            document.getElementById('unlock-ui').classList.remove('hidden-ui');
        };

        async function tryUnlock() {
            const pw = document.getElementById('pw').value;
            if (!pw) return;
            const success = await decryptAndRender(pw);
            if (success) {
                sessionStorage.setItem(STORAGE_KEY, pw);
                if (window.location.hash) {
                    history.replaceState(null, "", window.location.pathname + window.location.search);
                }
            } else {
                document.getElementById('err').classList.remove('hidden');
                document.getElementById('pw').value = '';
            }
        }

        async function decryptAndRender(password) {
            try {
                const bin = atob(_DATA);
                const bytes = new Uint8Array(bin.length);
                for(let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
                const keyBlockA = bytes.slice(0, 76), keyBlockB = bytes.slice(76, 152), ivContent = bytes.slice(152, 164), encryptedContent = bytes.slice(164);
                const enc = new TextEncoder();
                
                const unwrap = async (block) => {
                    try {
                        const salt = block.slice(0, 16), iv = block.slice(16, 28), wrapped = block.slice(28);
                        const keyMat = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
                        const derivedKey = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" }, keyMat, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
                        const rawKey = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, derivedKey, wrapped);
                        return new Uint8Array(rawKey);
                    } catch(e) { return null; }
                };

                let dataKey = await unwrap(keyBlockA);
                if (!dataKey) dataKey = await unwrap(keyBlockB);
                if (!dataKey) return false;

                const cryptoKey = await crypto.subtle.importKey("raw", dataKey, "AES-GCM", false, ["decrypt"]);
                const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: ivContent }, cryptoKey, encryptedContent);
                
                const htmlString = new TextDecoder().decode(decrypted);
                document.open(); 
                document.write(htmlString); 
                document.close();

                // 頁面動態渲染後，攔截與自動改寫所有 <a> 標籤，確保跳轉至子資料夾或新分頁時無需再輸入密碼
                setTimeout(() => {
                    document.querySelectorAll('a[href]').forEach(a => {
                        const href = a.getAttribute('href');
                        if (href && !href.startsWith('http://') && !href.startsWith('https://') && !href.startsWith('javascript:') && !href.startsWith('#')) {
                            a.addEventListener('click', (e) => {
                                const currentPass = sessionStorage.getItem(STORAGE_KEY);
                                if (currentPass) {
                                    const sep = a.href.includes('#') ? '&' : '#';
                                    if (!a.href.includes('pw=')) {
                                        a.href = a.href + sep + 'pw=' + encodeURIComponent(currentPass);
                                    }
                                }
                            });
                        }
                    });
                }, 200);

                return true;
            } catch (e) { 
                return false; 
            }
        }
